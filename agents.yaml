# irc-agents configuration. Run: uv run irc-agents --config agents.yaml
# Relative paths are resolved against this file's directory.

server:
  host: localhost
  port: 6667
  password: null # set if the IRC server uses IRC_PASSWORD
  channel: "#agents"

# Your IRC nick(s). Agents treat these as their operators; anyone else is treated as an agent.
humans: [jakub]

# Applied to every agent; any agent entry can override any key (deep merge).
defaults:
  prompt: prompts/default.md
  backend:
    type: ollama
    host: http://localhost:11434
    keep_alive: 30m # keep the model loaded between turns
    max_concurrent: 1 # one request at a time per Ollama server, so two models never load at once
    options:
      num_ctx: 4096 # context window; bigger uses more VRAM
      temperature: 0.7
      # num_gpu: 24  # optional: fixed number of layers on the GPU (the rest on the CPU), see README
  policy:
    max_agent_turns: 6 # agent turns in the channel before a human must speak again
    min_reply_interval: 2.0
    max_reply_lines: 8
    history_messages: 40
    reply_to_unaddressed_human: false # true: answer every line you write in the channel

agents:
  - nick: agent1_qwen
    description: Qwen3 8B, the more capable one; careful reasoning
    backend:
      model: qwen3:8b
      think: false # qwen3 is a reasoning model; false = faster, direct answers

  - nick: agent2_llama
    description: Llama 3.2 3B, very fast; short, practical answers
    backend:
      model: llama3.2:latest

  # More agents (the same model can be used several times under different nicks):
  # - nick: agent3_mistral
  #   description: Mistral 7B, a second opinion
  #   persona: You are a skeptical reviewer. Point out flaws and missing cases.
  #   backend:
  #     model: mistral:latest
  #   enabled: false
