[project]
name = "irc-agents"
version = "0.1.0"
description = "LLM agents (Ollama now; Claude/OpenAI later) that chat on an IRC channel"
readme = "README.md"
authors = [
    { name = "crimsonbluenight", email = "fablekiller@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
irc-agents = "irc_agents.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the real IRC server on localhost:6667 and Ollama (deselect with -m 'not integration')"]
